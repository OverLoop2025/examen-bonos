upstream bonus_api {
    zone bonus_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:8080 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://bonus_api;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
