services:
  db:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-BonosLocal2026}
      SQLCMDPASSWORD: ${SA_PASSWORD:-BonosLocal2026}
    ports:
      - "127.0.0.1:${SQL_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
      - ./database:/scripts:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-C", "-b", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  init:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${SA_PASSWORD:-BonosLocal2026}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        apply() {
          exists=$$(/opt/mssql-tools18/bin/sqlcmd -S db -U sa -C -b -h -1 -W -Q "SET NOCOUNT ON; SELECT IIF(OBJECT_ID('BonusTest.dbo.$$1') IS NULL, 0, 1)")
          if [ "$$(echo "$$exists" | tr -d '\r\n ')" = "0" ]; then
            /opt/mssql-tools18/bin/sqlcmd -S db -U sa -C -b -f 65001 -i "/scripts/$$2"
          fi
        }
        apply State 01_schema_seed.sql
        apply Bonus 02_bonus.sql
        apply BonusAllocation 03_bonus_allocation.sql

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__BonusTest: Server=db,1433;Database=BonusTest;User Id=sa;Password=${SA_PASSWORD:-BonosLocal2026};TrustServerCertificate=True
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
    ports:
      - "127.0.0.1:${API_PORT:-5106}:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-4200}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/api/v1/Catalog/departments"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  sql-data:
