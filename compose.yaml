services:
  db:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Completa SA_PASSWORD en .env}
      SQLCMDPASSWORD: ${SA_PASSWORD:?Completa SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:${SQL_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
      - ./database:/scripts:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-C", "-b", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  sql-data:
